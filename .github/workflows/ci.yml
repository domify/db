name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  LLVM_CONFIG: llvm-config-23

jobs:
  # rislang/ris has no release yet, so install_ris.sh has nothing to fetch.
  # ris is built from a pinned commit, as ris's own CI builds it, and cached
  # by that commit. macOS waits for a ris release for macOS arm64.
  #
  # No job container: driver_specs_test maps about 580k regions and Linux's
  # default vm.max_map_count is 65530. The limit is the host kernel's, so it
  # is raised on the runner itself.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RIS_REF: ce30d6dfc0f3aee8609cc061e69ab003fd3660c7
    steps:
      # The compiler's tape checkers also recurse past an 8 MB stack; each
      # step that compiles raises its own with ulimit -s.
      - name: Allow a million memory maps
        run: sudo sysctl -w vm.max_map_count=1048576

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: LLVM 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends llvm-23-dev > /dev/null
          llvm-config-23 --version

      - name: Restore ris
        id: ris-cache
        uses: actions/cache/restore@v4
        with:
          path: ris-src
          key: ris-host-${{ runner.os }}-${{ env.RIS_REF }}

      - name: Check out ris (cache miss)
        if: steps.ris-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: rislang/ris
          ref: ${{ env.RIS_REF }}
          path: ris-src
          persist-credentials: false

      - name: Build ris (cache miss)
        if: steps.ris-cache.outputs.cache-hit != 'true'
        run: |
          ulimit -s 65536
          make -C ris-src ris

      - name: Save ris
        if: steps.ris-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ris-src
          key: ${{ steps.ris-cache.outputs.cache-primary-key }}

      - run: echo "$GITHUB_WORKSPACE/ris-src/bin" >> "$GITHUB_PATH"

      - run: ris version

      - name: Test
        run: |
          ulimit -s 65536
          ris test db

      # Every test again, compiled from the .iyimod artifacts a first build
      # wrote, so the library keeps building module by module (R-1).
      # Not a gate yet: ris's own std/log_text.iyi exports
      # `def self.text(value)` untyped, which --emit-iyimod refuses (R-2) for
      # every program that imports Log. Make it a gate again once ris fixes it.
      - name: Test from artifacts
        continue-on-error: true
        run: |
          ulimit -s 65536
          for test in db/*_test.ri; do
            mods="$RUNNER_TEMP/mods/$(basename "$test" .ri)"
            mkdir -p "$mods"
            ris build --emit-iyimod "$mods" "$test" -o "$RUNNER_TEMP/emitted"
            ris build --use-iyimod "$mods" "$test" -o "$RUNNER_TEMP/reused"
            "$RUNNER_TEMP/reused"
          done

      - name: Build the manual programs
        run: |
          ulimit -s 65536
          for program in manual/*.ri; do
            echo "building $program"
            ris build "$program" -o "$RUNNER_TEMP/manual"
          done

      - name: Check formatting
        run: ris fmt --check db manual
