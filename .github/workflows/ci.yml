name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# git refuses a workspace another user owns; a container job's is one.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  LLVM_CONFIG: llvm-config-23

jobs:
  # rislang/ris has no release yet, so install_ris.sh has nothing to fetch.
  # ris is built from a pinned commit the way ris's own CI builds it, and
  # cached by that commit. macOS waits for a ris release for macOS arm64.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: crystallang/crystal:1.21.0-build
      # The compiler's tape checkers recurse past an 8 MB stack.
      options: --ulimit stack=67108864:67108864
    env:
      RIS_REF: ce30d6dfc0f3aee8609cc061e69ab003fd3660c7
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: LLVM 23
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl xz-utils zstd > /dev/null
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends llvm-23-dev > /dev/null
          llvm-config-23 --version

      - name: Restore ris
        id: ris-cache
        uses: actions/cache/restore@v4
        with:
          path: ris-src
          key: ris-${{ runner.os }}-${{ env.RIS_REF }}

      - name: Check out ris (cache miss)
        if: steps.ris-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: rislang/ris
          ref: ${{ env.RIS_REF }}
          path: ris-src
          persist-credentials: false

      - name: Build ris (cache miss)
        if: steps.ris-cache.outputs.cache-hit != 'true'
        run: make -C ris-src ris

      - name: Save ris
        if: steps.ris-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ris-src
          key: ${{ steps.ris-cache.outputs.cache-primary-key }}

      - run: echo "$GITHUB_WORKSPACE/ris-src/bin" >> "$GITHUB_PATH"

      - run: ris version

      - name: Test
        run: ris test db

      # Every test again, compiled from the .iyimod artifacts a first build
      # wrote, so the library keeps building module by module (R-1).
      - name: Test from artifacts
        run: |
          for test in db/*_test.ri; do
            mods="$RUNNER_TEMP/mods/$(basename "$test" .ri)"
            mkdir -p "$mods"
            ris build --emit-iyimod "$mods" "$test" -o "$RUNNER_TEMP/emitted"
            ris build --use-iyimod "$mods" "$test" -o "$RUNNER_TEMP/reused"
            "$RUNNER_TEMP/reused"
          done

      - name: Build the manual programs
        run: |
          for program in manual/*.ri; do
            echo "building $program"
            ris build "$program" -o "$RUNNER_TEMP/manual"
          done

      - name: Check formatting
        run: ris fmt --check db manual
