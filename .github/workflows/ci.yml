name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The oldest ris this release supports (README, Requirements).
      RIS_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Install ris
        run: |
          curl -fsSL https://raw.githubusercontent.com/rislang/ris/main/install_ris.sh | RIS_PREFIX="$HOME/.ris" sh
          echo "$HOME/.ris/bin" >> "$GITHUB_PATH"

      - run: ris version

      - name: Test
        run: ris test db

      # Every test again, compiled from the .iyimod artifacts a first build
      # wrote, so the library keeps building module by module (R-1).
      - name: Test from artifacts
        run: |
          for test in db/*_test.ri; do
            mods="$RUNNER_TEMP/mods/$(basename "$test" .ri)"
            mkdir -p "$mods"
            ris build --emit-iyimod "$mods" "$test" -o "$RUNNER_TEMP/emitted"
            ris build --use-iyimod "$mods" "$test" -o "$RUNNER_TEMP/reused"
            "$RUNNER_TEMP/reused"
          done

      - name: Build the manual programs
        run: |
          for program in manual/*.ri; do
            echo "building $program"
            ris build "$program" -o "$RUNNER_TEMP/manual"
          done

      - name: Check formatting
        run: ris fmt --check db manual
        if: matrix.os == 'ubuntu-24.04'
